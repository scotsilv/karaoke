<title>COPFAC Karaoke</title>

<style>
/* Layout: one narrow phone column — sunset stage hero, then the sign-up card; host view is a tabbed control board. Single night-beach look. */
:root{
  --night:#16173a;      /* sky after sundown */
  --dusk:#2b2257;       /* upper sunset band */
  --coral:#ff6b4a;      /* sunset / primary action */
  --sun:#ffc24b;        /* sun + highlights */
  --sea:#2ec4b6;        /* ocean / ready state */
  --sand:#fff4e2;       /* text on dark */
  --muted:#b9b2d8;
  --card:#211f4b;
  --line:#3b3770;
  --danger:#ff8a9a;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--sand)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
p{margin:0}
.banner{background:var(--sun);color:#2a1d00;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px}
/* hero */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  background:linear-gradient(180deg,var(--dusk) 0%,#5b2c6f 38%,#c4466a 62%,var(--coral) 78%,var(--sun) 100%)}
.hero-inner{position:relative;z-index:1;padding:28px 20px 0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

.appname{font-family:var(--display);font-size:clamp(18px,5vw,24px);letter-spacing:.04em;color:var(--sun);margin-top:2px}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--sand);opacity:.9}
.hero h1{font-size:clamp(34px,10vw,52px);color:var(--sand);text-shadow:0 3px 0 rgba(22,23,58,.35)}
.hero h1 span{color:var(--sun)}
.stage{display:block;width:100%;height:auto;margin-top:6px;margin-bottom:-1px}
.lineup{display:flex;justify-content:space-around;background:var(--night);padding:10px 8px 16px;font-size:12px;color:var(--muted);text-align:center}
.lineup b{display:block;color:var(--sand);font-size:14px}
/* cards & forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:22px;color:var(--sun)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.fact{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 6px}
.fact b{display:block;font-family:var(--display);font-size:15px;color:var(--sand)}
.fact span{font-size:12px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label small{font-weight:400;color:var(--muted)}
input,textarea,select{font:inherit;font-size:16px;color:var(--sand);background:var(--night);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,194,75,.25)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{background:var(--coral);color:#fff;font-weight:700;font-size:17px;padding:15px 18px;box-shadow:0 4px 0 #b8432b}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b8432b}
.btn[disabled]{opacity:.6}
.btn-ghost{background:transparent;color:var(--sand);border:1.5px solid var(--line);padding:10px 14px;font-weight:600}
.err{color:var(--danger);font-size:14px}
.done{text-align:center;align-items:center}
.done .big{font-size:56px;line-height:1}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
/* host */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.top .logo{width:120px;margin:0}
.top-name{font-family:var(--display);color:var(--sun);font-size:15px;line-height:1.1;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);padding:10px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--coral);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}
.item>div{min-width:0}
.song{font-weight:700;font-size:16px}
.who{font-size:14px;color:var(--muted)}
.extra{grid-column:1/-1;font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--line);color:var(--sand);white-space:nowrap}
.pill.new{background:#4a3f8a}.pill.learning{background:var(--sun);color:#2a1d00}.pill.ready{background:var(--sea);color:#06302c}.pill.cut{background:#55304a;color:var(--danger)}.item.cut .actions .textbtn{background:var(--danger);color:#3a0d16}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.actions button{background:var(--night);color:var(--sand);border:1px solid var(--line);padding:7px 11px;font-size:13px;font-weight:600;border-radius:10px}
.now{background:linear-gradient(135deg,var(--coral),#c4466a);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px}
.now .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.9}
.now .name{font-family:var(--display);font-size:clamp(30px,9vw,44px);line-height:1.05;word-break:break-word}
.now .tune{font-size:18px;font-weight:600}
.next{border:2px dashed var(--sun);border-radius:18px;padding:14px 16px}
.next .lbl{color:var(--sun);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.next .name{font-family:var(--display);font-size:24px}
.pos{font-family:var(--display);color:var(--sun);font-variant-numeric:tabular-nums;margin-right:6px}
.textbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 14px;background:var(--sun);color:#2a1d00;margin-top:8px}
.actions .textbtn{margin-top:0;padding:7px 11px;font-size:13px;border-radius:10px}
.textbtn.alt{background:rgba(255,255,255,.18);color:#fff;padding:9px 12px;font-size:14px}
.phone{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;user-select:all}
.empty{color:var(--muted);text-align:center;padding:24px;border:1.5px dashed var(--line);border-radius:14px}
details.add summary{cursor:pointer;font-weight:700;color:var(--sun)}
details.add[open]{display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
@media (prefers-reduced-motion:no-preference){.sunpulse{animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.85}}}

<script>
/* ---------- settings ---------- */
const CONFIG = {
  supabaseUrl: "https://syrxcwwhapzcyoilnerp.supabase.co",          // filled in once the live database is set up
  supabaseKey: "sb_publishable_sDvlDLkb1IvwTquXZMV9Sw_pFq9x6NY",

/* ---------- storage: live database or this-phone preview ---------- */
const SAMPLE = [
  {singer:"Example: Dana R.",phone:"(256) 555-0101",song:"Sweet Caroline",artist:"Neil Diamond",backup:"Brown Eyed Girl – Van Morrison",notes:"",status:"ready"},

  {singer:"Example: Jose M.",phone:"(256) 555-0104",song:"Livin' on a Prayer",artist:"Bon Jovi",backup:"Don't Stop Believin' – Journey",notes:"",status:"ready"}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const Local = {
  rows(){let r=lsGet("pk_rows",null);if(!r){r=SAMPLE.map((s,i)=>({id:"s"+i,created_at:new Date(Date.now()-(9-i)*36e5).toISOString(),position:null,performed:false,...s}));lsSet("pk_rows",r)}return r},
  async add(rec){const r=this.rows();r.push({id:"l"+Date.now(),created_at:new Date().toISOString(),status:"new",position:null,performed:false,...rec});lsSet("pk_rows",r)},
  async list(){return this.rows()},
  async update(id,patch){const r=this.rows().map(x=>x.id===id?{...x,...patch}:x);lsSet("pk_rows",r)},
  async remove(id){lsSet("pk_rows",this.rows().filter(x=>x.id!==id))},
  async checkPin(){return true}
};
const Live = {
  h(){return{apikey:CONFIG.supabaseKey,Authorization:"Bearer "+CONFIG.supabaseKey,"Content-Type":"application/json"}},
  async rpc(fn,body){const r=await fetch(CONFIG.supabaseUrl+"/rest/v1/rpc/"+fn,{method:"POST",headers:this.h(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()},
  async add(rec){const r=await fetch(CONFIG.supabaseUrl+"/rest/v1/signups",{method:"POST",headers:{...this.h(),Prefer:"return=minimal"},body:JSON.stringify(rec)});if(!r.ok)throw new Error(await r.text())},
  async list(){return this.rpc("host_list",{p_pin:pin()})},
  async update(id,patch){return this.rpc("host_update",{p_pin:pin(),p_id:Number(id),p_patch:patch})},
  async remove(id){return this.rpc("host_delete",{p_pin:pin(),p_id:Number(id)})},
  async hostAdd(rec){return this.rpc("host_add",{p_pin:pin(),p_rec:rec})},
  async checkPin(p){return this.rpc("host_check",{p_pin:p})}
};
const store = LIVE ? Live : Local;
const pin = ()=> lsGet("pk_pin","");

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const closed = ()=> Date.now() > new Date(CONFIG.signupDeadline).getTime();
const previewBanner = LIVE ? "" : `<p class="banner" role="note">Preview mode: sign-ups are saved only on this phone. Rows marked "Example" are sample data.</p>`;
const LOGO = `<div class="logo" role="img" aria-label="Colors on Parade"></div>`;

/* ---------- stage illustration ---------- */
const STAGE = `<svg class="stage" viewBox="0 0 400 190" role="img" aria-label="A three-piece band with guitar, drums and piano playing on a beach stage at sunset">
 <circle class="sunpulse" cx="200" cy="120" r="70" fill="#ffc24b" opacity=".95"/>
 <g fill="#2ec4b6" opacity=".55"><rect x="0" y="122" width="400" height="6"/><rect x="30" y="134" width="340" height="4"/><rect x="70" y="144" width="260" height="3"/></g>
 <g fill="#16173a">
  <path d="M18 190 C22 140 26 110 34 78 L38 80 C31 112 28 142 26 190Z"/>

  <path d="M374 190 C372 150 366 118 360 92 L364 90 C371 116 377 150 382 190Z"/>
  <path d="M361 91 C374 80 390 82 400 92 C386 86 374 88 363 94Z M361 90 C362 74 372 64 386 62 C374 70 368 80 364 92Z M360 91 C352 76 338 70 324 74 C338 76 350 84 358 94Z"/>
  <rect x="0" y="168" width="400" height="22"/>

 <rect x="40" y="160" width="320" height="10" rx="2" fill="#2b2257"/>
 <!-- Phil: guitar -->
 <g transform="translate(92 76)">
  <circle cx="22" cy="10" r="10" fill="#16173a"/><path d="M8 26 Q22 18 36 26 L38 84 L6 84Z" fill="#16173a"/>
  <g transform="rotate(-28 22 56)"><ellipse cx="14" cy="60" rx="15" ry="12" fill="#ff6b4a"/><circle cx="14" cy="60" r="4" fill="#16173a"/><rect x="24" y="57" width="34" height="5" rx="1" fill="#ff6b4a"/><rect x="56" y="55" width="8" height="9" rx="2" fill="#ff6b4a"/></g>
 </g>

 <g transform="translate(170 80)">
  <circle cx="30" cy="8" r="10" fill="#16173a"/><path d="M14 24 Q30 16 46 24 L48 54 L12 54Z" fill="#16173a"/>
  <line x1="14" y1="30" x2="-2" y2="40" stroke="#16173a" stroke-width="5" stroke-linecap="round"/><line x1="-2" y1="40" x2="4" y2="30" stroke="#fff4e2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="30" x2="62" y2="18" stroke="#16173a" stroke-width="5" stroke-linecap="round"/><line x1="62" y1="18" x2="70" y2="8" stroke="#fff4e2" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="78" cy="20" rx="14" ry="3" fill="#ffc24b"/><line x1="78" y1="20" x2="78" y2="78" stroke="#16173a" stroke-width="2"/>
  <ellipse cx="-14" cy="34" rx="12" ry="3" fill="#ffc24b"/><line x1="-14" y1="34" x2="-14" y2="78" stroke="#16173a" stroke-width="2"/>
  <circle cx="30" cy="64" r="20" fill="#2ec4b6"/><circle cx="30" cy="64" r="14" fill="#16173a" opacity=".25"/>
  <rect x="2" y="44" width="16" height="12" rx="3" fill="#2ec4b6"/><rect x="44" y="44" width="16" height="12" rx="3" fill="#2ec4b6"/>
 </g>

 <g transform="translate(262 82)">
  <circle cx="28" cy="8" r="10" fill="#16173a"/><path d="M12 24 Q28 16 44 24 L46 60 L10 60Z" fill="#16173a"/>
  <line x1="14" y1="32" x2="4" y2="46" stroke="#16173a" stroke-width="5" stroke-linecap="round"/><line x1="42" y1="32" x2="52" y2="46" stroke="#16173a" stroke-width="5" stroke-linecap="round"/>
  <rect x="-10" y="44" width="78" height="14" rx="2" fill="#fff4e2"/>
  <g fill="#16173a"><rect x="-4" y="44" width="4" height="8"/><rect x="6" y="44" width="4" height="8"/><rect x="20" y="44" width="4" height="8"/><rect x="30" y="44" width="4" height="8"/><rect x="40" y="44" width="4" height="8"/><rect x="54" y="44" width="4" height="8"/></g>
  <rect x="-10" y="58" width="78" height="6" fill="#ff6b4a"/><rect x="-6" y="64" width="4" height="16" fill="#16173a"/><rect x="60" y="64" width="4" height="16" fill="#16173a"/>
 </g>
 <g fill="#fff4e2" opacity=".8"><path d="M150 40 l3 0 0 12 a4 3 0 1 1 -2 -2 l0 -8 -1 0Z"/><path d="M248 30 l8 -2 0 12 a4 3 0 1 1 -2 -2 l0 -6 -4 1 0 9 a4 3 0 1 1 -2 -2Z"/></g>
</svg>`;

/* ---------- sign-up view ---------- */
function renderSignup(sent){
  const isClosed = closed();
  $("#app").innerHTML = `
  <header class="hero">
    <div class="hero-inner">
      ${LOGO}
      <p class="appname">COPFAC Karaoke</p>
      <p class="kicker">National Convention · ${CONFIG.place}</p>
      <h1>Sing with the <span>band</span></h1>
    </div>
    ${STAGE}
  </header>
  ${previewBanner}
  <section class="card">
    <p>This year the house band is backing <em>you</em>. Pick a song, and once the band approves it we'll learn it before ${CONFIG.place}. If it's not one we can pull off, we'll text you to pick another. On karaoke night, listen for your name.</p>
    <div class="facts">
      <div class="fact"><b>${CONFIG.deadlineLabel}</b><span>Sign-ups close</span></div>
      <div class="fact"><b>Apr 24</b><span>Show night</span></div>
      <div class="fact"><b>Live</b><span>3-piece band</span></div>
    </div>
  </section>
  ${sent ? `
  <section class="card done" aria-live="polite">
    <div class="big" aria-hidden="true">🎤</div>
    <h2>Thanks for your request!</h2>
    <p><b>${esc(sent.song)}</b> by ${esc(sent.artist)}<br>Sung by ${esc(sent.singer)}</p>
    <p>The band will consider your song and either approve or decline it. If it's declined, you'll get a text asking you to pick another song.</p>
    <p class="foot">Want to add another song or sign up a friend?</p>
    <button class="btn-ghost" id="again">Sign up another song</button>
  </section>` : isClosed ? `
  <section class="card done"><h2>Sign-ups are closed</h2><p>The band is busy rehearsing. See you in ${CONFIG.place}!</p></section>` : `
  <form class="card" id="f" novalidate>
    <h2>Pick your song</h2>
    <label for="singer">Your name<input id="singer" name="singer" autocomplete="name" maxlength="80" placeholder="First and last name" required></label>
    <label for="phone">Cell phone <small>We'll text you when you're up next. Used only for karaoke night.</small><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(256) 555-0123" required></label>
    <div class="row2">
      <label for="song">Song title<input id="song" name="song" maxlength="120" placeholder="Sweet Caroline" required></label>
      <label for="artist">Artist<input id="artist" name="artist" maxlength="120" placeholder="Neil Diamond" required></label>
    </div>
    <label for="notes">Anything the band should know? <small>Optional: duet partner, key, your company or region</small><textarea id="notes" name="notes" rows="2" maxlength="300"></textarea></label>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="go" type="submit">Put me on the list</button>
  </form>`}
  <p class="foot">${CONFIG.eventLabel} · ${CONFIG.place}</p>`;
  const f=$("#f");
  if(f) f.addEventListener("submit",async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));Object.keys(d).forEach(k=>d[k]=d[k].trim());
    const err=$("#err");
    if(!d.singer||!d.song||!d.artist||!d.phone){err.textContent="Please fill in your name, cell phone, the song title and the artist.";err.hidden=false;return}
    if(d.phone.replace(/\D/g,"").length<10){err.textContent="Please enter a 10-digit cell number so we can text you.";err.hidden=false;return}

  });
  const a=$("#again"); if(a) a.onclick=()=>renderSignup();
}

/* ---------- texting from the host's phone ---------- */
const digits=p=>String(p||"").replace(/[^\d+]/g,"");
const signupLink=()=>location.origin.startsWith("http")?location.origin+location.pathname:"the sign-up link";
const smsMsg=(r,now)=>now==="redo"
  ? `Hi ${r.singer.split(" ")[0]}, thanks for signing up for COPFAC Karaoke! Our 3-piece band can't pull off "${r.song}", so please pick another song here: ${signupLink()}`
  : now
  ? `Hi ${r.singer.split(" ")[0]}! You're up NOW for COPFAC Karaoke: "${r.song}". Head to the stage!`
  : `Hi ${r.singer.split(" ")[0]}! You're up NEXT for COPFAC Karaoke: "${r.song}". Please head toward the stage now. – Colors on Parade band`;
const smsHref=(r,now)=>`sms:${digits(r.phone)}?&body=${encodeURIComponent(smsMsg(r,now))}`;
const texted=()=>lsGet("pk_texted",{});
function textBtn(r,now,cls){
  if(!r.phone) return `<span class="who">No phone on file</span>`;
  const key=r.id+(now==="redo"?"r":now?"n":"");const t=texted()[key];
  const lbl=now==="redo"?"Text: pick another song":now?"Text: you're up now":"Text: you're up next";
  return `<a class="${cls}" href="${smsHref(r,now)}" data-text="${key}">${t?"✓ Texted · send again":lbl}</a>`;
}

/* ---------- host view ---------- */
let rows=[], tab=lsGet("pk_tab","set"), q="", poll;
const STATUS=[["new","Needs review"],["learning","Approved · learning"],["ready","Ready to play"],["cut","Not approved"]];
const BTN={new:"Back to review",learning:"Approve",ready:"Mark ready",cut:"Not approved"};
const ORDER={new:0,cut:1,learning:2,ready:3};
const label=s=>(STATUS.find(x=>x[0]===s)||STATUS[0])[1];

async function renderHost(){
  if(!pin() && LIVE){return renderPin()}
  try{rows=await store.list()||[]}catch(e){if(LIVE){lsSet("pk_pin","");return renderPin("That PIN didn't work.")}}
  drawHost();
  clearInterval(poll); if(LIVE) poll=setInterval(async()=>{try{rows=await store.list()||[];if(!document.activeElement||document.activeElement.tagName!=="INPUT")drawHost()}catch(e){}},6000);
}
function renderPin(msg){
  $("#app").innerHTML=`<div class="top">${LOGO}</div>
  <form class="card" id="pf"><h2>Host sign-in</h2><p>Enter the host PIN to see the set list and run the show.</p>
  <label for="pin">Host PIN<input id="pin" inputmode="numeric" autocomplete="off"></label>
  ${msg?`<p class="err">${esc(msg)}</p>`:""}<button class="btn">Open host screen</button></form>`;
  $("#pf").onsubmit=async e=>{e.preventDefault();const p=$("#pin").value.trim();try{if(await store.checkPin(p)){lsSet("pk_pin",p);renderHost()}else renderPin("That PIN didn't work.")}catch(x){renderPin("Couldn't reach the list. Check your connection.")}};
}
function queue(){
  return rows.filter(r=>!r.performed&&(r.status==="learning"||r.status==="ready"))
    .sort((a,b)=>(a.position??1e9)-(b.position??1e9)||a.created_at.localeCompare(b.created_at));
}
function drawHost(){
  const qd=queue(), done=rows.filter(r=>r.performed);
  const c=s=>rows.filter(r=>r.status===s).length;
  const match=r=>!q||[r.singer,r.song,r.artist].join(" ").toLowerCase().includes(q);
  const setRows=[...rows].sort((a,b)=>(ORDER[a.status]-ORDER[b.status])||a.song.localeCompare(b.song)).filter(match);
  const item=(r,show,i)=>`<div class="item ${show?"":esc(r.status)}">
    <div><div class="song">${show?`<span class="pos">${i+1}</span>`:""}${esc(r.song)} <span class="who">· ${esc(r.artist)}</span></div><div class="who">${esc(r.singer)}${r.phone?` · <span class="phone">${esc(r.phone)}</span>`:""}</div></div>
    ${show?"":`<span class="pill ${esc(r.status)}">${label(r.status)}</span>`}
    ${r.backup||r.notes?`<div class="extra">${r.backup?`Backup: ${esc(r.backup)}`:""}${r.backup&&r.notes?" · ":""}${esc(r.notes||"")}</div>`:""}
    <div class="actions">${show?`
      <button data-a="up" data-id="${r.id}" aria-label="Move up">↑ Up</button><button data-a="down" data-id="${r.id}" aria-label="Move down">↓ Down</button>
      <button data-a="last" data-id="${r.id}">Send to end</button><button data-a="done" data-id="${r.id}">Sang it</button>`
      : (r.status==="cut"?textBtn(r,"redo","textbtn alt"):"")+STATUS.filter(s=>s[0]!==r.status&&!(r.status==="new"&&s[0]==="ready")).map(s=>`<button data-a="st" data-v="${s[0]}" data-id="${r.id}">${BTN[s[0]]}</button>`).join("")+`<button data-a="del" data-id="${r.id}">Remove</button>`}
    </div></div>`;
  $("#app").innerHTML=`
  <div class="top">${LOGO}<span class="top-name">COPFAC<br>Karaoke</span><a class="btn-ghost" href="#" style="text-decoration:none;border-radius:12px">Sign-up page</a></div>
  ${previewBanner}
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==="set"}" data-tab="set">Set list</button><button role="tab" aria-selected="${tab==="show"}" data-tab="show">Show night</button></div>
  ${tab==="set"?`
    <div class="stats"><div class="stat"><b>${rows.length}</b><span>Songs</span></div><div class="stat"><b>${c("new")}</b><span>To review</span></div><div class="stat"><b>${c("learning")+c("ready")}</b><span>Approved</span></div><div class="stat"><b>${c("cut")}</b><span>Not OK</span></div></div>
    <div class="search"><input id="q" type="search" placeholder="Search singer, song or artist" value="${esc(q)}" aria-label="Search"></div>
    <div class="list">${setRows.length?setRows.map(r=>item(r,false)).join(""):`<p class="empty">${rows.length?"Nothing matches that search.":"No sign-ups yet. Share the sign-up page link and songs will show up here."}</p>`}</div>`
  :`
    ${qd[0]?`<section class="now" aria-live="polite"><span class="lbl">Now singing</span><span class="name">${esc(qd[0].singer)}</span><span class="tune">${esc(qd[0].song)} · ${esc(qd[0].artist)}</span><div>${textBtn(qd[0],true,"textbtn alt")}</div></section>
      <button class="btn" data-a="done" data-id="${qd[0].id}">Done — call the next singer</button>`
      :`<p class="empty">The queue is empty. Add a walk-up singer below.</p>`}
    ${qd[1]?`<div class="next"><span class="lbl">On deck</span><div class="name">${esc(qd[1].singer)}</div><div class="who">${esc(qd[1].song)} · ${esc(qd[1].artist)}</div>${textBtn(qd[1],false,"textbtn")}</div>`:""}
    <h3 style="font-size:18px;color:var(--sun)">Running order · ${qd.length} left</h3>
    <div class="list">${qd.map((r,i)=>item(r,true,i)).join("")}</div>
    <details class="add card"><summary>Add a walk-up singer</summary>
      <form id="wf" style="display:flex;flex-direction:column;gap:10px">
      <input id="w1" placeholder="Singer's name" maxlength="80"><input id="w4" type="tel" inputmode="tel" placeholder="Cell phone (optional)" maxlength="20"><div class="row2"><input id="w2" placeholder="Song" maxlength="120"><input id="w3" placeholder="Artist" maxlength="120"></div>
      <button class="btn">Add to end of queue</button></form></details>
    ${done.length?`<h3 style="font-size:18px;color:var(--muted)">Already sang · ${done.length}</h3><div class="list">${done.map(r=>`<div class="item"><div><div class="song">${esc(r.song)}</div><div class="who">${esc(r.singer)}</div></div><div class="actions"><button data-a="undo" data-id="${r.id}">Put back in queue</button></div></div>`).join("")}</div>`:""}
  `}
  <p class="foot">${LIVE?"Updates every few seconds.":""}</p>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;lsSet("pk_tab",tab);drawHost()});
  const qi=$("#q"); if(qi) qi.oninput=()=>{q=qi.value.toLowerCase();const pos=qi.selectionStart;drawHost();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  const wf=$("#wf"); if(wf) wf.onsubmit=async e=>{e.preventDefault();const r={singer:$("#w1").value.trim(),song:$("#w2").value.trim(),artist:$("#w3").value.trim(),phone:$("#w4").value.trim()};if(!r.singer||!r.song)return;
    const max=Math.max(0,...queue().map((x,i)=>x.position??i));r.status="ready";r.position=max+1;
    try{LIVE?await Live.hostAdd(r):await Local.add(r)}catch(x){}renderHost()};
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id,b.dataset.v));
  document.querySelectorAll("[data-text]").forEach(a=>a.addEventListener("click",()=>{const t=texted();t[a.dataset.text]=1;lsSet("pk_texted",t);setTimeout(drawHost,400)}));
}
async function act(a,id,v){
  const qd=queue(), i=qd.findIndex(r=>r.id==id);
  try{
    if(a==="st") await store.update(id,{status:v});
    else if(a==="del"){const b=document.querySelector(`[data-a="del"][data-id="${id}"]`);if(b.dataset.sure){await store.remove(id)}else{b.dataset.sure="1";b.textContent="Tap again to remove";return}}
    else if(a==="done") await store.update(id,{performed:true});
    else if(a==="undo") await store.update(id,{performed:false});
    else if(a==="up"||a==="down"||a==="last"){
      const order=qd.map(r=>r.id); order.splice(i,1);
      const to=a==="up"?Math.max(0,i-1):a==="down"?Math.min(order.length,i+1):order.length;
      order.splice(to,0,id);
      for(let k=0;k<order.length;k++){const r=qd.find(x=>x.id==order[k]);if(r.position!==k)await store.update(order[k],{position:k})}
    }
  }catch(e){}
  renderHost();
}

/* ---------- routing ---------- */
function route(){clearInterval(poll); location.hash==="#host"?renderHost():renderSignup()}
window.addEventListener("hashchange",route); route();
</script>
</body></html>
